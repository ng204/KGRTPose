# Ultralytics YOLO, AGPL-3.0 license
# YOLOv8-pose + KAAM + STGR for fish keypoint detection

# Parameters
task: pose
nc: 1 # number of classes
kpt_shape: [15, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# CSPNeXt backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, STEM, [64]]                              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2, 1]]                    # 1-P2/4
  - [-1, 3, CSPNeXtBlock, [128, True, False, True]]  # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2, 1]]                    # 3-P3/8
  - [-1, 6, CSPNeXtBlock, [256, True, False, True]]  # 4-P3/8
  - [-1, 1, KAAM, [256]]                             # 5-P3/8 KAAM
  - [-1, 1, Conv, [512, 3, 2, 1]]                    # 6-P4/16
  - [-1, 6, CSPNeXtBlock, [512, True, False, True]]  # 7-P4/16
  - [-1, 1, KAAM, [512]]                             # 8-P4/16 KAAM
  - [-1, 1, Conv, [1024, 3, 2, 1]]                   # 9-P5/32
  - [-1, 3, CSPNeXtBlock, [1024, False, True, True]] # 10-P5/32

# CSPNeXt head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 11
  - [[-1, 8], 1, Concat, [1]]                        # cat backbone P4-KAAM (layer 8)
  - [-1, 3, CSPNeXtBlock, [512]]                     # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 14
  - [[-1, 5], 1, Concat, [1]]                        # cat backbone P3-KAAM (layer 5)
  - [-1, 3, CSPNeXtBlock, [256]]                     # 16 (P3/8-small)
  - [-1, 1, KAAM, [256]]                             # 17 KAAM on P3

  - [-1, 1, Conv, [256, 3, 2]]                       # 18
  - [[-1, 13], 1, Concat, [1]]                       # cat head P4
  - [-1, 3, CSPNeXtBlock, [512]]                     # 20 (P4/16-medium)
  - [-1, 1, KAAM, [512]]                             # 21 KAAM on P4

  - [-1, 1, Conv, [512, 3, 2]]                       # 22
  - [[-1, 10], 1, Concat, [1]]                       # cat head P5 (layer 10)
  - [-1, 3, CSPNeXtBlock, [1024]]                    # 24 (P5/32-large)
  - [-1, 1, KAAM, [1024]]                            # 25 KAAM on P5

  - [[17, 21, 25], 1, PoseRTMO, [nc, kpt_shape, None, True]]  # 26 (skeleton=None, graph_refine=True)