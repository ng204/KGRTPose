# YOLOv8-pose + RepLK_BRA (backbone P5) for fish keypoint detection

# Parameters
task: pose
nc: 1 # number of classes
kpt_shape: [6, 5] # number of keypoints, number of dims (5 for x,y,visible,log_sx,log_sy with RLE)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# CSPNeXt backbone: P5 stage replaced with RepLK_BRA
backbone:
  # [from, repeats, module, args]
  - [-1, 1, STEM, [64]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2, 1]] # 1-P2/4
  - [-1, 3, CSPNeXtBlock, [128, True, False, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2, 1]] # 3-P3/8
  - [-1, 6, CSPNeXtBlock, [256, True, False, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2, 1]] # 5-P4/16
  - [-1, 6, CSPNeXtBlock, [512, True, False, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2, 1]] # 7-P5/32
  - [-1, 1, RepLK_BRA, [1024, 13, 5, 8, 4, 5]] # 8-P5/32 (RepLK large_k=13, small_k=5, heads=8, topk=4, region=5)

# CSPNeXt head (unchanged topology, same indices as original)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]] # 10 cat backbone P4
  - [-1, 3, CSPNeXtBlock, [512]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 4], 1, Concat, [1]] # 13 cat backbone P3
  - [-1, 3, CSPNeXtBlock, [256]] # 14 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 15
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P4
  - [-1, 3, CSPNeXtBlock, [512]] # 17 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 18
  - [[-1, 8], 1, Concat, [1]] # 19 cat head P5
  - [-1, 3, CSPNeXtBlock, [1024]] # 20 (P5/32-large)

  - [[14, 17, 20], 1, PoseRTMO, [nc, kpt_shape]] # 21
